# Nginx settings for the LMS on Azure App Service (Linux, PHP 8.x).
# Replaces the .htaccess rules, which Nginx ignores.

server {
    listen 8080;
    listen [::]:8080;
    root /home/site/wwwroot;
    index index.php index.html index.htm hostingstart.html;
    server_name _;

    client_max_body_size 64m;

    # ---- Clean URLs (translated from .htaccess) ----
    rewrite ^/admin/user-profile/?$ /admin/user-profile.php last;
    rewrite ^/admin/user-profile/([0-9]+)/?$ /admin/user-profile.php?id=$1 last;
    rewrite ^/admin/courses/edit/([0-9]+)/?$ /admin/courses.php?edit=$1 last;

    rewrite ^/course/([0-9]+)/?$ /course.php?id=$1 last;
    rewrite ^/lesson/([0-9]+)/?$ /lesson.php?id=$1 last;
    rewrite ^/assignment/([0-9]+)/?$ /assignment.php?id=$1 last;
    rewrite ^/quiz/([0-9]+)/?$ /quiz.php?id=$1 last;

    rewrite ^/instructor/reports/quizzes/([0-9]+)/([0-9]+)/?$ /instructor/reports.php?report=quizzes&course_id=$1&quiz_id=$2 last;
    rewrite ^/instructor/reports/(progress|gradebook|students|quizzes|awaiting)/([0-9]+)/?$ /instructor/reports.php?report=$1&course_id=$2 last;
    rewrite ^/instructor/reports/(progress|gradebook|students|quizzes|awaiting)/?$ /instructor/reports.php?report=$1 last;
    rewrite ^/instructor/export-csv/cohort/([0-9]+)/?$ /instructor/export-csv.php?report=cohort&cohort_id=$1 last;
    rewrite ^/instructor/export-csv/(gradebook|students|progress|quiz_attempts|reviews)/([0-9]+)/?$ /instructor/export-csv.php?report=$1&course_id=$2 last;

    rewrite ^/instructor/modules/add_module/([0-9]+)/?$ /instructor/modules/add_module.php?id=$1 last;
    rewrite ^/instructor/modules/edit_module/([0-9]+)/([0-9]+)/?$ /instructor/modules/edit_module.php?course_id=$1&id=$2 last;

    rewrite ^/instructor/courses/course_lesson/([0-9]+)/?$ /instructor/courses/course_lesson.php?course_id=$1 last;
    rewrite ^/instructor/courses/courses_edit_form/([0-9]+)/?$ /instructor/courses/courses_edit_form.php?id=$1 last;
    rewrite ^/instructor/lessons/add/([0-9]+)/([0-9]+)/?$ /instructor/lessons/lesson_add_form.php?course_id=$1&module_id=$2 last;
    rewrite ^/instructor/lessons/add/([0-9]+)/?$ /instructor/lessons/lesson_add_form.php?course_id=$1 last;
    rewrite ^/instructor/assignment-grading/list/([0-9]+)/?$ "/instructor/assignment and grading/assessment_list.php?course_id=$1" last;
    rewrite ^/instructor/assignment-grading/add/([0-9]+)/?$ "/instructor/assignment and grading/assessment_add_form.php?course_id=$1" last;
    rewrite ^/instructor/assignment-grading/edit-assignment/([0-9]+)/?$ "/instructor/assignment and grading/assignment_edit_form.php?id=$1" last;
    rewrite ^/instructor/assignment-grading/edit-quiz/([0-9]+)/?$ "/instructor/assignment and grading/quiz_edit_form.php?id=$1" last;
    rewrite ^/instructor/assignment-grading/submissions/([0-9]+)/?$ "/instructor/assignment and grading/assignment_submissions.php?id=$1" last;
    rewrite ^/instructor/assignment-grading/grade/([0-9]+)/?$ "/instructor/assignment and grading/submission_grade.php?id=$1" last;
    rewrite ^/instructor/students/cohorts/([0-9]+)/?$ /instructor/students/cohorts.php?course_id=$1 last;
    rewrite ^/instructor/students/cohort/([0-9]+)/?$ /instructor/students/cohort_view.php?id=$1 last;
    rewrite ^/instructor/students/students/([0-9]+)/cohort/([0-9]+)/?$ /instructor/students/students.php?course_id=$1&cohort_id=$2 last;
    rewrite ^/instructor/students/students/([0-9]+)/?$ /instructor/students/students.php?course_id=$1 last;
    rewrite ^/instructor/students/course/([0-9]+)/student/([0-9]+)/?$ /instructor/students/student_view.php?course_id=$1&id=$2 last;

    # Extensionless pages: /dashboard -> /dashboard.php (when that file exists)
    set $page "";
    if ($uri ~ "^/(.+?)/?$") {
        set $page $1;
    }
    if (-f "$document_root/$page.php") {
        rewrite ^ "/$page.php" last;
    }

    location / {
        index index.php index.html index.htm hostingstart.html;
    }

    # ---- Keep private files private ----
    location ^~ /logs/      { deny all; }
    location ^~ /database/  { deny all; }
    location ^~ /includes/  { deny all; }
    location ^~ /emails/    { deny all; }
    location ^~ /vendor/    { deny all; }
    location ^~ /.github/   { deny all; }
    location = /nginx-default.conf { deny all; }
    location ~ /\.git       { deny all; }

    # No PHP execution inside uploads
    location ~* ^/uploads/.*\.(php[0-9]?|phtml|phar)$ { deny all; }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html { root /html/; }

    # ---- PHP ----
    location ~ [^/]\.php(/|$) {
        fastcgi_split_path_info ^(.+?\.php)(|/.*)$;
        fastcgi_pass 127.0.0.1:9000;
        include fastcgi_params;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_intercept_errors on;
        fastcgi_connect_timeout 300;
        fastcgi_send_timeout 3600;
        fastcgi_read_timeout 3600;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;

        # same as the no-cache header in .htaccess
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
    }
}
